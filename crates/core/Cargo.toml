[package]
name = "supercode-core"
description = "SuperCode 核心库：agent 适配层、审批代理、事件管道、进程管理、注册表与持久化"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
agent-client-protocol = "2.2.0"
command-group = { version = "5.0.1", features = ["with-tokio"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time", "fs", "sync"] }
tokio-util = "0.7.19"
uuid = { version = "1.26.1", features = ["v4"] }
