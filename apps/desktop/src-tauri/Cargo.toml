[package]
name = "supercode-desktop"
version = "0.1.0"
description = "SuperCode 多 Agent 桌面总控客户端（Tauri 壳）"
authors = ["Adiao1973"]
edition = "2021"
rust-version = "1.88"

[lib]
# `_lib` 后缀避免与 bin 同名冲突（Windows 链接器限制，见 rust-lang/cargo#8519）
name = "supercode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
